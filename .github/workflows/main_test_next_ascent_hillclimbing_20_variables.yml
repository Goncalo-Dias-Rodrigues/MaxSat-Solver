name: Run Main Test Next Ascent Hillclimbing 20 Variables

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  run-main:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run main.py with automatic inputs
        run: |
          printf '2\n2\n30\n1\n' | python -u -m src/main.py